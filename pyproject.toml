[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-bot"
version = "1.0.0"
description = "Telegram Bot Application"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.8.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "APScheduler>=3.10.4",
    "aiosqlite>=0.20.0",
    "openai>=1.40.0",
    "pytrends>=4.9.2",
    "tenacity>=8.5.0",
    "orjson>=3.10.7",
]

[project.scripts]
telegram-bot = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["telegram_bot*"]
