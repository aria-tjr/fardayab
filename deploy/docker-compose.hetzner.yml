version: "3.9"

services:
  telegram-bot:
    build:
      context: ../telegram_bot
      dockerfile: Dockerfile
    container_name: telegram-bot
    env_file:
      - ../config/.env
    environment:
      - TZ=Asia/Tehran
    volumes:
      - ../config/.env:/app/config/.env:ro
      - ../data:/app/data
    restart: unless-stopped
    networks:
      - bot-network
    ports:
      - "2a01:4f8:1c1a:9cc1::1:8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys; sys.exit(0)"]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:alpine
    container_name: telegram-bot-nginx
    ports:
      - "2a01:4f8:1c1a:9cc1::1:80:80"
      - "2a01:4f8:1c1a:9cc1::1:443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - telegram-bot
    restart: unless-stopped
    networks:
      - bot-network

  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_POLL_INTERVAL=1200
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_INCLUDE_RESTARTING=true
      - WATCHTOWER_SCOPE=telegram-bot
    command: --scope telegram-bot telegram-bot
    restart: unless-stopped
    networks:
      - bot-network

networks:
  bot-network:
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.20.0.0/16
        - subnet: 2a01:4f8:1c1a:9cc1::/64
